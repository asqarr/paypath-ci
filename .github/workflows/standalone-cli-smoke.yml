name: Standalone PayPath CLI Smoke Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: standalone-cli-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  standalone-cli-smoke:
    name: Standalone CLI Tarball Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR code without a persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install locked build dependencies
        run: npm ci

      - name: Build, pack, install, and exercise the isolated CLI tarball
        run: node scripts/standalone-cli-smoke.mjs
